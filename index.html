<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متابعة المساعد الإداري للأداء الوظيفي للعام 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style id="css">
:root{--g:#0f5a4a;--g2:#13785f;--gl:#e6f2ed;--gold:#c79a3b;--goldl:#f7efdc;--navy:#1f3f7a;--teal:#178a8a;--ink:#1f2a2e;--mute:#76838a;--line:#e3ded2;--bg:#f7f4ee;--ok:#16835a;--ok-l:#e2f4ea;--no:#c0453b;--no-l:#fbe7e5;--hdr:#e4ece7;--goal:#d9dee2}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
.hero{background:linear-gradient(135deg,#0b4639 0%,var(--g2) 100%);color:#fff;padding:18px 16px 54px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 10% 120%,rgba(199,154,59,.35),transparent 45%),radial-gradient(circle at 95% -20%,rgba(255,255,255,.12),transparent 40%);pointer-events:none}
.hero-in{max-width:1200px;margin:0 auto;position:relative;z-index:1;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.hero .k{font-size:12px;color:#cfe6dd;letter-spacing:0}
.hero h1{margin:4px 0 0;font-size:20px;font-weight:800;line-height:1.4}
.hero h1 input{width:62px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:6px;color:#fff;text-align:center;font-weight:800;padding:0 4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700}
.hero .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.hero .btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.hero .btn.white{background:#fff;color:var(--g);border-color:#fff}
.btn.danger{color:var(--no);background:#fff}
.btn.danger.arm{background:var(--no);color:#fff;border-color:var(--no)}
.btn:disabled{opacity:.5;cursor:default}
.status{font-size:12px;color:#cfe6dd;width:100%}
.status.dirty{color:#ffd98a;font-weight:700}
.wrap{max-width:1200px;margin:-38px auto 0;padding:0 14px 30px;position:relative;z-index:2}
.emps{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin}
.emp{flex:none;width:210px;background:#fff;border:2px solid transparent;border-radius:14px;padding:10px 12px;cursor:pointer;text-align:right;box-shadow:0 2px 10px rgba(15,90,74,.08);display:flex;gap:10px;align-items:center}
.emp.on{border-color:var(--gold)}
.av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--gl);color:var(--g);display:grid;place-items:center;font-weight:800;font-size:16px}
.emp.on .av{background:var(--g);color:#fff}
.emp .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp .jb{font-size:12px;color:var(--mute)}
.emp .mb{height:4px;background:#eee;border-radius:4px;margin-top:5px;overflow:hidden}.emp .mb i{display:block;height:100%;background:var(--gold)}
.emp.add{justify-content:center;border:2px dashed #d6ccb5;box-shadow:none;background:#fffdf8;color:var(--gold);font-weight:800;width:130px}
.emp .tx{min-width:0;flex:1}
.banner{background:#fff6e0;border:1px solid #f0d48a;border-radius:12px;padding:10px 12px;margin:0 0 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 14px rgba(31,42,46,.05)}
.prof{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{flex:none;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring:before{content:"";position:absolute;inset:11px;background:#fff;border-radius:50%}
.ring b{position:relative;font-size:26px;font-weight:800;color:var(--g)}
.ring small{position:relative;display:block;font-size:11px;color:var(--mute);text-align:center;margin-top:-4px}
.ring .in{position:relative;text-align:center}
.pf{flex:1;min-width:240px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px;font-weight:500}
.fld input,.fld textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fcfbf8}
.fld input:focus,.fld textarea:focus,.tile input:focus,.gdesc:focus{outline:2px solid var(--gold);outline-offset:-1px;background:#fff}
.pills{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pill{border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-l);color:var(--ok)}.pill.no{background:var(--no-l);color:var(--no)}.pill.em{background:#f1eee7;color:var(--mute)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px;gap:8px;flex-wrap:wrap}
.sec h2{margin:0;font-size:17px;font-weight:800;color:var(--g)}
.legend{display:flex;gap:10px;font-size:12px;color:var(--mute);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:4px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.gcard{background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 14px rgba(31,42,46,.05);border-top:4px solid var(--g)}
.gh{display:flex;align-items:center;gap:10px}
.num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--goldl);color:var(--gold);display:grid;place-items:center;font-weight:800}
.gh h3{margin:0;font-size:15px;font-weight:800;flex:1}
.gh .cnt{font-size:12px;color:var(--mute);font-weight:700}
.gdesc{display:block;width:100%;margin:10px 0 8px;field-sizing:content;line-height:1.5;border:1px dashed #d9d1bf;border-radius:10px;padding:7px 10px;font-size:13px;background:#fcfbf8;resize:vertical;min-height:38px}
.gbar{height:6px;border-radius:6px;background:#f0ece3;overflow:hidden;display:flex;margin-bottom:10px}
.gbar i{display:block;height:100%}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);border-radius:12px;padding:6px;background:#fcfbf8;display:flex;flex-direction:column;gap:5px}
.tile.ok{background:var(--ok-l);border-color:#bfe3cf}.tile.no{background:var(--no-l);border-color:#efc4bf}
.tb{display:flex;align-items:center;justify-content:space-between;border:none;background:transparent;cursor:pointer;padding:2px 2px;font-size:12px;font-weight:700;color:var(--ink);width:100%}
.ic{width:22px;height:22px;border-radius:50%;border:2px solid #cfc6b3;display:grid;place-items:center;font-size:12px;font-weight:800;background:#fff}
.tile.ok .ic{background:var(--ok);border-color:var(--ok);color:#fff}
.tile.no .ic{background:var(--no);border-color:var(--no);color:#fff}
.tile .lb{font-size:10.5px;color:var(--mute);font-weight:700}
.tile.ok .lb{color:var(--ok)}.tile.no .lb{color:var(--no)}
.tile input{border:1px solid transparent;border-radius:8px;padding:4px 6px;font-size:12px;width:100%;background:rgba(255,255,255,.75)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.foot{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.hint{font-size:12px;color:var(--mute)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (max-width:600px){.pf{grid-template-columns:1fr}.hero h1{font-size:17px}.goals{grid-template-columns:1fr}.ring{width:96px;height:96px}.ring b{font-size:22px}}
.gnl{display:block;font-size:12px;font-weight:700;color:var(--g);margin:10px 2px 4px}
.gnote{display:block;width:100%;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;background:#fffdf6;resize:vertical;min-height:44px}
.gnote:focus{outline:2px solid var(--gold);outline-offset:-1px;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kpi{border-radius:14px;padding:10px 12px;background:#fcfbf8;border:1px solid var(--line)}
.kpi .kh{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px}
.kpi .ki{font-size:15px}
.kpi input{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:16px;font-weight:700}
.kpi input:focus{outline:2px solid var(--gold);outline-offset:-1px}
.k-growth{background:var(--gl);border-color:#cfe5db}.k-absExc{background:var(--goldl);border-color:#ecdcb5}.k-absNo{background:var(--no-l);border-color:#efc4bf}.k-absNo .kh{color:var(--no)}.k-absExc .kh{color:#9a7424}.k-late{background:#f3ecf8;border-color:#e0d0ec}.k-late .kh{color:#6b3f8f}.k-assembly{background:#e8eef8;border-color:#cdd9ee}.k-assembly .kh{color:var(--navy)}

#printHost{position:fixed;left:-20000px;top:0;pointer-events:none}
.sheet{width:1123px;height:794px;background:#fff;padding:24px 28px 22px;font-family:'Tajawal',sans-serif;color:#1d2733;direction:rtl;position:relative;display:flex;flex-direction:column;overflow:hidden}
.sheet .band{position:absolute;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--navy),var(--teal))}
.sheet .band.t{top:0}.sheet .band.b{bottom:0}
.sheet .sh-h{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--teal);padding-bottom:8px}
.sheet .sh-min{color:var(--teal);font-weight:800;font-size:20px;line-height:1.2}
.sheet .sh-en{color:#7b8790;font-size:11px}
.sheet .sh-t{font-weight:800;font-size:19px;color:var(--navy)}
.sheet .sh-pg{font-size:12px;color:#7b8790;min-width:110px;text-align:left}
.sheet table{border-collapse:collapse;width:100%}
.sheet .info{margin-top:10px}
.sheet .info td{border:1px solid #9aa6ae;padding:6px 8px;font-size:14px;font-weight:500}
.sheet .info td.k{background:var(--hdr);font-weight:700;font-size:12.5px;white-space:nowrap}
.sheet .info td.v{width:105px;text-align:center}
.sheet .g{margin-top:10px;table-layout:fixed;flex:1}
.sheet .g th,.sheet .g td{border:1px solid #9aa6ae;font-size:12px;padding:3px 2px;text-align:center;vertical-align:middle}
.sheet .g thead th{background:var(--hdr);font-weight:800;font-size:12.5px;height:26px}
.sheet .g thead tr.sub th{font-weight:600;font-size:11px;background:#eef3f0;height:22px}
.sheet .g .gc{background:#eef1f3;font-weight:800;width:250px;text-align:right;padding:5px 7px;font-size:13.5px;color:var(--navy)}
.sheet .g .gc small{display:block;font-weight:500;font-size:11px;line-height:1.45;color:#2b3640;white-space:pre-line;margin-top:2px}
.sheet .st{display:inline-block;padding:3px 7px;border-radius:5px;font-weight:800;font-size:12px}
.sheet .st.ok{background:var(--ok-l);color:var(--ok)}
.sheet .st.no{background:var(--no-l);color:var(--no)}
.sheet .st.na{color:#c3cad0}
.sheet .dt{font-size:11.5px;line-height:1.3;font-weight:600;word-break:break-word}
.sheet .sec{font-weight:800;font-size:15px;color:var(--navy);margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.sheet .sec:before{content:"";width:5px;height:18px;border-radius:3px;background:var(--teal)}
.sheet .box{border:1px solid #9aa6ae;border-radius:8px;padding:10px 14px;font-size:14.5px;line-height:1.8;white-space:pre-wrap;min-height:70px}
.sheet .gn td{border:1px solid #9aa6ae;padding:7px 10px;font-size:14px;line-height:1.7;vertical-align:top}
.sheet .gn td.k{background:var(--hdr);font-weight:800;width:130px;white-space:nowrap}
.sheet .kp td{border:1px solid #9aa6ae;padding:8px 6px;text-align:center;font-size:15px;font-weight:700}
.sheet .kp tr:first-child td{background:var(--hdr);font-size:13px;font-weight:800}
.sheet.t1 .g .gc{width:290px}.sheet.t1 .g .gc small{font-size:10.3px;line-height:1.35}.sheet.t2 .g .gc{width:320px}.sheet.t2 .g .gc small{font-size:9.6px;line-height:1.3}.sheet.t2 .info td{padding:4px 8px}
.sheet .sigs{margin-top:auto;display:flex;gap:40px;padding-top:16px}
.sheet .sigs > div{flex:1;font-size:15px}
.sheet .sigs b{font-weight:800}
.sheet .sigs .ln{margin-top:28px;border-top:1px dotted #6b7785;padding-top:4px;font-size:12px;color:#7b8790;width:70%}
@media (max-width:600px){main{padding:10px}.card{padding:12px}.top h1{font-size:15px}}

  else if(t.dataset.gt!=null){e.goals[+t.dataset.gt].t=t.value;}
  else if(t.dataset.gn!=null){e.goals[+t.dataset.gn].n=t.value;}
  else if(t.dataset.d){e.goals[+t.dataset.g].r[+t.dataset.r].d=t.value;}
  else return;markDirty();});

document.addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;
  if(b.dataset.emp!=null){cur=+b.dataset.emp;render();window.scrollTo(0,0);return;}
  if(b.dataset.cyc){var gi=+b.dataset.g,ri=+b.dataset.r,cell=state.employees[cur].goals[gi].r[ri];cell.s=cell.s===''?'ok':cell.s==='ok'?'no':'';
    var t=document.getElementById('t'+gi+'_'+ri);var tmp=document.createElement('div');tmp.innerHTML=tileHTML(cell,gi,ri);t.replaceWith(tmp.firstChild);
    var g=state.employees[cur].goals[gi];document.getElementById('gb'+gi).innerHTML=gbar(g);document.getElementById('gc'+gi).textContent=goalCnt(g).ok+' من '+NR;
    refreshCounts();markDirty();return;}
  var a=b.dataset.act;if(!a)return;
  if(a==='add'){state.employees.push(blankEmp());cur=state.employees.length-1;markDirty();render();toast('تمت إضافة موظفة جديدة');}
  else if(a==='dup'){var src=state.employees[cur],n=JSON.parse(JSON.stringify(src));n.id='e'+Date.now().toString(36);n.name='';n.goals.forEach(function(g){g.n='';g.r.forEach(function(r){r.s='';r.d='';});});n.notes='';XF.forEach(function(k){n[k]='';});
    state.employees.push(n);cur=state.employees.length-1;markDirty();render();toast('نُسخ النموذج بأوصاف الأهداف — أدخلي اسم الموظفة');}
  else if(a==='del'){if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='اضغطي مرة أخرى لتأكيد الحذف';setTimeout(function(){if(b.isConnected){b.classList.remove('arm');b.textContent='حذف هذه الموظفة';}},3500);return;}
    state.employees.splice(cur,1);cur=Math.max(0,cur-1);markDirty();render();toast('تم الحذف');}
  else if(a==='restore'){try{state=mig(JSON.parse(draftOffer));}catch(e){}draftOffer=null;cur=0;dirty=true;render();}
  else if(a==='discard'){draftOffer=null;try{localStorage.removeItem(DRAFT_KEY);}catch(e){}render();}
  else if(a==='save')save();
  else if(a==='backup'){var dt=new Date().toISOString().slice(0,10);downloadsCap.save({filename:'متابعة-الأهداف-'+dt+'.json',data:JSON.stringify(state,null,1)});toast('تم تنزيل النسخة الاحتياطية');}
  else if(a==='import'){var fi=document.createElement('input');fi.type='file';fi.accept='.json,application/json';fi.onchange=function(){var f=fi.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var ns=mig(JSON.parse(rd.result));if(!ns.employees)throw 0;state=ns;cur=0;markDirty();render();toast('تم استيراد البيانات');}catch(e){toast('الملف غير صالح');}};rd.readAsText(f);};fi.click();}
  else if(a==='pdf')exportPDF([state.employees[cur]],b);
  else if(a==='pdfall')exportPDF(state.employees,b);
});

/* ---------- save: republish the page with the new state embedded ---------- */
function buildDoc(){
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  var css=document.getElementById('css').textContent,app=document.getElementById('app').textContent;
  var C='<'+'/script>';
  return '<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>'+document.title+'</title>\n'+
   '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">\n<style id="css">'+css+'</style>\n'+
   '<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">'+C+'\n<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">'+C+'\n'+
   '<script type="application/json" id="state">'+json+C+'\n</head>\n<body>\n<div id="root"></div>\n<div id="printHost"></div>\n<div class="toast" id="toast"></div>\n<script id="app">'+app+C+'\n</body>\n</html>';
}
async function save(){if(!artifactCap||saving)return;saving=true;updateStatus();
  try{await artifactCap.publish(buildDoc());try{localStorage.removeItem(DRAFT_KEY);}catch(e){}dirty=false;toast('تم الحفظ');}
  catch(err){var c=err&&err.code;
    if(c==='conflict')toast('عُدّلت الصفحة من مكان آخر؛ ستُحدَّث الآن. تعديلاتك محفوظة كمسودة على هذا الجهاز.');
    else if(c==='not_granted'||c==='not_writer')toast('ليست لديك صلاحية الحفظ على هذه الصفحة.');
    else toast('تعذّر الحفظ، حاولي مرة أخرى.');}
  saving=false;updateStatus();}

/* ---------- PDF ---------- */
function sheetHead(pg){return '<div class="band t"></div><div class="band b"></div><div class="sh-h"><div><div class="sh-min">وزارة التعليم</div><div class="sh-en">Ministry of Education</div></div><div class="sh-t">متابعة المساعد الإداري للأداء الوظيفي للعام '+esc(state.year)+'</div><div class="sh-pg">صفحة '+pg+' من 2</div></div>';}
function infoTable(e){return '<table class="info"><tr><td class="k">اسم المساعد الإداري</td><td>'+esc(e.name)+'</td><td class="k">يوم جلسة المتابعة النصف سنوية</td><td class="v">'+esc(e.midDay)+'</td><td class="k">تاريخ جلسة المتابعة النصف سنوية</td><td class="v">'+esc(e.midDate)+'</td></tr><tr><td class="k">الوظيفة</td><td>'+esc(e.job)+'</td><td class="k">يوم جلسة المتابعة النهائية للأداء الوظيفي</td><td class="v">'+esc(e.finDay)+'</td><td class="k">تاريخ جلسة المتابعة النهائية للأداء الوظيفي</td><td class="v">'+esc(e.finDate)+'</td></tr></table>';}
function sheetPages(e){
  var h='<div class="sheet">'+sheetHead(1)+infoTable(e);
  h+='<table class="g"><thead><tr><th class="gc" rowspan="2" style="text-align:center">الهدف</th>';
  for(var j=0;j<NR;j++)h+='<th colspan="2">التقرير '+ORD[j]+'</th>';
  h+='</tr><tr class="sub">';for(j=0;j<NR;j++)h+='<th>الإنجاز</th><th>التاريخ</th>';h+='</tr></thead><tbody>';
  e.goals.forEach(function(g,gi){h+='<tr><td class="gc">الهدف '+ORD[gi]+(g.t?'<small>'+esc(g.t)+'</small>':'')+'</td>';
    g.r.forEach(function(r){var s=r.s==='ok'?'<span class="st ok">تم</span>':r.s==='no'?'<span class="st no">لم يتم</span>':'<span class="st na">—</span>';
      h+='<td>'+s+'</td><td class="dt">'+esc(r.d)+'</td>';});h+='</tr>';});
  h+='</tbody></table></div>';
  var p='<div class="sheet">'+sheetHead(2)+infoTable(e);
  p+='<div class="sec">ملاحظات مديرة المدرسة</div><div class="box">'+(esc((e.notes||'').trim())||'—')+'</div>';
  var gn=e.goals.map(function(g,i){return g.n&&g.n.trim()?'<tr><td class="k">الهدف '+ORD[i]+'</td><td>'+esc(g.n.trim())+'</td></tr>':'';}).join('');
  if(gn)p+='<div class="sec">ملاحظات الأهداف</div><table class="gn">'+gn+'</table>';
  var late=esc(e.late)+(e.late&&/^[0-9٠-٩]+$/.test(String(e.late).trim())?' دقيقة':'');
  p+='<div class="sec">النمو المهني والانضباط</div><table class="kp"><tr><td>النمو المهني</td><td>الغياب بعذر</td><td>الغياب بدون عذر</td><td>التأخير الصباحي</td><td>حضور الطابور الصباحي</td></tr><tr><td>'+(esc(e.growth)||'—')+'</td><td>'+(esc(e.absExc)||'—')+'</td><td>'+(esc(e.absNo)||'—')+'</td><td>'+(late||'—')+'</td><td>'+(esc(e.assembly)||'—')+'</td></tr></table>';
  p+='<div class="sigs"><div><b>مديرة المدرسة / </b>'+esc(state.principal)+'<div class="ln">التوقيع</div></div><div><b>المساعد الإداري / </b>'+esc(e.name)+'<div class="ln">التوقيع</div></div></div></div>';
  return [h,p];
}
async function exportPDF(list,btn){
  if(!downloadsCap)return;if(!window.html2canvas||!window.jspdf){toast('أدوات التصدير لم تُحمَّل بعد، أعيدي المحاولة بعد لحظات.');return;}
  if(!list.length)return;var old=btn.textContent;btn.disabled=true;btn.textContent='جارٍ التجهيز…';
  try{
    var pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});var host=document.getElementById('printHost');
    try{await document.fonts.ready;}catch(e){}
    var first=true;
    for(var i=0;i<list.length;i++){var pages=sheetPages(list[i]);
      for(var k=0;k<pages.length;k++){host.innerHTML=pages[k];
        var el=host.firstElementChild;if(el.scrollHeight>el.clientHeight+1)el.classList.add('t1');if(el.scrollHeight>el.clientHeight+1){el.classList.remove('t1');el.classList.add('t2');}
        var cv=await html2canvas(el,{scale:2.5,backgroundColor:'#ffffff',useCORS:true,logging:false});
        if(!first)pdf.addPage();first=false;pdf.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',0,0,297,210);}}
    host.innerHTML='';
    var name=list.length===1?('متابعة أهداف - '+(list[0].name||'موظفة')):'متابعة أهداف المساعدات الإداريات';
    await downloadsCap.save({filename:name.replace(/[\\/:*?"<>|]/g,'')+'.pdf',data:pdf.output('blob')});
    toast('تم تجهيز ملف PDF');
  }catch(err){var c=err&&err.code;if(c==='declined'){}else if(c==='rate_limited')toast('هناك نافذة حفظ مفتوحة بالفعل.');else toast('تعذّر تصدير PDF.');}
  btn.disabled=false;btn.textContent=old;
}

render();
downloadsCap={save:function(o){var bl=o.data instanceof Blob?o.data:new Blob([o.data],{type:/\.json$/.test(o.filename)?'application/json':'application/octet-stream'});var u=URL.createObjectURL(bl);var l=document.createElement('a');l.href=u;l.download=o.filename;document.body.appendChild(l);l.click();setTimeout(function(){URL.revokeObjectURL(u);l.remove();},1500);return Promise.resolve({status:'saved'});}};
capsReady=true;render();
})();
</script>
