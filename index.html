var cur=0,dirty=false,saving=false,artifactCap=null,downloadsCap=null,capsReady=false,draftOffer=null;

function blankEmp(){var g=[];for(var i=0;i<NG;i++){var r=[];for(var j=0;j<NR;j++)r.push({s:'',d:''});g.push({t:'',r:r,n:''});}
  return {id:'e'+Date.now().toString(36),name:'',job:'',day:'',date:'',goals:g,notes:'',growth:'',absExc:'',absNo:'',late:'',assembly:''};}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function counts(e){var ok=0,no=0;e.goals.forEach(function(g){g.r.forEach(function(c){if(c.s==='ok')ok++;else if(c.s==='no')no++;});});return {ok:ok,no:no,pc:Math.round(ok*100/(NG*NR))};}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show');},3200);}



var storeOK=true;function markDirty(){try{localStorage.setItem(STORE,JSON.stringify(state));storeOK=true;dirty=false;}catch(e){storeOK=false;dirty=true;}updateStatus();}
function updateStatus(){var s=document.getElementById('st');if(!s)return;
  if(saving){s.textContent='جارٍ الحفظ…';s.className='status';return;}
  if(dirty){s.textContent='تعذّر الحفظ التلقائي — احفظي نسخة احتياطية';s.className='status dirty';}
  else{s.textContent='تُحفظ التعديلات تلقائيًا في هذا المتصفح';s.className='status';}
  var b=document.getElementById('saveBtn');if(b)b.disabled=!dirty||saving;}

function initial(n){n=(n||'').trim();return n?n.charAt(0):'؟';}
function ringStyle(c){var t=NG*NR,a=c.ok*360/t,b=a+c.no*360/t;return 'background:conic-gradient(var(--ok) 0 '+a+'deg,var(--no) '+a+'deg '+b+'deg,#efe9dd '+b+'deg 360deg)';}
function goalCnt(g){var ok=0,no=0;g.r.forEach(function(r){if(r.s==='ok')ok++;else if(r.s==='no')no++;});return {ok:ok,no:no};}
function gbar(g){var c=goalCnt(g);return '<i style="width:'+(c.ok*100/NR)+'%;background:var(--ok)"></i><i style="width:'+(c.no*100/NR)+'%;background:var(--no)"></i>';}
function tileHTML(r,gi,ri){var ic=r.s==='ok'?'✓':r.s==='no'?'✕':'',lb=r.s==='ok'?'تم':r.s==='no'?'لم يتم':'—';
  return '<div class="tile '+r.s+'" id="t'+gi+'_'+ri+'"><button class="tb" data-g="'+gi+'" data-r="'+ri+'" data-cyc="1"><span>التقرير '+ORD[ri]+'<br><span class="lb">'+lb+'</span></span><span class="ic">'+ic+'</span></button><input data-g="'+gi+'" data-r="'+ri+'" data-d="1" value="'+esc(r.d)+'" placeholder="التاريخ"></div>';}
function render(){
  var e=state.employees[cur];var root=document.getElementById('root');var h='';
  h+='<div class="hero"><div class="hero-in"><div><div class="k">وزارة التعليم · المساعدات الإداريات</div><h1>المتابعة النصف سنوية لأهداف المساعد الإداري للعام <input data-top="year" value="'+esc(state.year)+'">م</h1></div><div class="acts">';
  if(capsReady&&artifactCap)h+='<button class="btn gold" id="saveBtn" data-act="save">حفظ</button>';
  if(capsReady&&downloadsCap)h+='<button class="btn white" data-act="pdf">تصدير PDF</button><button class="btn" data-act="pdfall">PDF للجميع</button><button class="btn" data-act="backup">نسخة احتياطية</button><button class="btn" data-act="import">استيراد</button>';
  h+='<span class="status" id="st"></span></div></div></div><div class="wrap">';
  h+='<div class="emps">';
  state.employees.forEach(function(x,i){var c=counts(x);h+='<button class="emp'+(i===cur?' on':'')+'" data-emp="'+i+'"><span class="av">'+esc(initial(x.name))+'</span><span class="tx"><div class="nm">'+esc(x.name||'موظفة جديدة')+'</div><div class="jb">'+esc(x.job||'—')+' · '+c.pc+'%</div><div class="mb"><i style="width:'+(c.ok*100/(NG*NR))+'%"></i></div></span></button>';});
  h+='<button class="emp add" data-act="add">+ موظفة</button></div>';
  if(draftOffer)h+='<div class="banner">لديك تعديلات غير محفوظة من زيارة سابقة على هذا الجهاز. <button class="btn" data-act="restore">استعادتها</button><button class="btn" data-act="discard">تجاهلها</button></div>';
  if(!e){root.innerHTML=h+'<div class="card">لا توجد موظفات. أضيفي موظفة جديدة.</div></div>';updateStatus();return;}
  var c=counts(e);
  h+='<div class="card prof"><div class="ring" id="ring" style="'+ringStyle(c)+'"><div class="in"><b id="pc">'+c.pc+'%</b><small>نسبة الإنجاز</small></div></div><div style="flex:1;min-width:240px"><div class="pf">'+fld('name','اسم المساعد الإداري',e.name)+fld('job','الوظيفة',e.job)+fld('day','اليوم',e.day)+fld('date','التاريخ',e.date)+'</div><div class="pills" id="pills">'+pills(c)+'</div></div></div>';
  h+='<div class="sec"><h2>الأهداف والتقارير</h2><div class="legend"><span><i class="dot" style="background:var(--ok)"></i>تم</span><span><i class="dot" style="background:var(--no)"></i>لم يتم</span><span>اضغطي على التقرير لتغيير حالته</span></div></div><div class="goals">';
  e.goals.forEach(function(g,gi){var gc=goalCnt(g);
    h+='<div class="gcard"><div class="gh"><span class="num">'+(gi+1).toLocaleString('ar-SA')+'</span><h3>الهدف '+ORD[gi]+'</h3><span class="cnt" id="gc'+gi+'">'+gc.ok+' من '+NR+'</span></div><textarea class="gdesc" rows="3" data-gt="'+gi+'" placeholder="وصف الهدف (اختياري)">'+esc(g.t)+'</textarea><div class="gbar" id="gb'+gi+'">'+gbar(g)+'</div><div class="tiles">';
    g.r.forEach(function(r,ri){h+=tileHTML(r,gi,ri);});h+='</div><label class="gnl">ملاحظات الهدف</label><textarea class="gnote" rows="2" data-gn="'+gi+'" placeholder="اكتبي ملاحظاتك على هذا الهدف…">'+esc(g.n)+'</textarea></div>';});
  h+='</div><div class="sec"><h2>الملاحظات والاعتماد</h2></div><div class="card"><div class="kpis">'+kpi('growth','النمو المهني','📚',e.growth,'مثال: 8 دورات تدريبية')+kpi('absExc','الغياب بعذر','📄',e.absExc,'عدد الأيام')+kpi('absNo','الغياب بدون عذر','⚠️',e.absNo,'عدد الأيام')+kpi('late','التأخير الصباحي (بالدقائق)','⏰',e.late,'عدد دقائق التأخير')+kpi('assembly','حضور الطابور الصباحي','🌅',e.assembly,'مثال: 30 من 31')+'</div></div><div class="card">'+area('notes','ملاحظات',e.notes,4)+'</div>';
  h+='<div class="card foot"><div class="fld" style="flex:1;min-width:220px"><label>مديرة المدرسة</label><input data-top="principal" value="'+esc(state.principal)+'"></div><div class="acts"><button class="btn" data-act="dup">نسخ النموذج لموظفة جديدة</button><button class="btn danger" data-act="del">حذف هذه الموظفة</button></div></div></div>';
  root.innerHTML=h;updateStatus();
}
function pills(c){var em=NG*NR-c.ok-c.no;return '<span class="pill ok">تم: '+c.ok+'</span><span class="pill no">لم يتم: '+c.no+'</span><span class="pill em">لم يُقيَّم: '+em+'</span>';}
function kpi(k,l,ic,v,ph){return '<div class="kpi k-'+k+'"><div class="kh"><span class="ki">'+ic+'</span>'+l+'</div><input data-f="'+k+'" value="'+esc(v)+'" placeholder="'+ph+'"></div>';}
function fld(k,l,v){return '<div class="fld"><label>'+l+'</label><input data-f="'+k+'" value="'+esc(v)+'"></div>';}
function area(k,l,v,r){return '<div class="fld"><label>'+l+'</label><textarea data-f="'+k+'" rows="'+r+'">'+esc(v)+'</textarea></div>';}
function refreshCounts(){var e=state.employees[cur],c=counts(e);
  var p=document.getElementById('pills');if(p)p.innerHTML=pills(c);
  var pc=document.getElementById('pc');if(pc)pc.textContent=c.pc+'%';
  var rg=document.getElementById('ring');if(rg)rg.setAttribute('style',ringStyle(c));
  var chip=document.querySelector('.emp[data-emp="'+cur+'"]');
  if(chip)chip.innerHTML='<span class="av">'+esc(initial(e.name))+'</span><span class="tx"><div class="nm">'+esc(e.name||'موظفة جديدة')+'</div><div class="jb">'+esc(e.job||'—')+' · '+c.pc+'%</div><div class="mb"><i style="width:'+(c.ok*100/(NG*NR))+'%"></i></div></span>';}

document.addEventListener('input',function(ev){var t=ev.target,e=state.employees[cur];if(!e&&!t.dataset.top)return;
  if(t.dataset.f){e[t.dataset.f]=t.value;if(t.dataset.f==='name'||t.dataset.f==='job')refreshCounts();}
  else if(t.dataset.top){state[t.dataset.top]=t.value;}
  else if(t.dataset.gt!=null){e.goals[+t.dataset.gt].t=t.value;}
  else if(t.dataset.gn!=null){e.goals[+t.dataset.gn].n=t.value;}
  else if(t.dataset.d){e.goals[+t.dataset.g].r[+t.dataset.r].d=t.value;}
  else return;markDirty();});

document.addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;
  if(b.dataset.emp!=null){cur=+b.dataset.emp;render();window.scrollTo(0,0);return;}
  if(b.dataset.cyc){var gi=+b.dataset.g,ri=+b.dataset.r,cell=state.employees[cur].goals[gi].r[ri];cell.s=cell.s===''?'ok':cell.s==='ok'?'no':'';
    var t=document.getElementById('t'+gi+'_'+ri);var tmp=document.createElement('div');tmp.innerHTML=tileHTML(cell,gi,ri);t.replaceWith(tmp.firstChild);
    var g=state.employees[cur].goals[gi];document.getElementById('gb'+gi).innerHTML=gbar(g);document.getElementById('gc'+gi).textContent=goalCnt(g).ok+' من '+NR;
    refreshCounts();markDirty();return;}
  var a=b.dataset.act;if(!a)return;
  if(a==='add'){state.employees.push(blankEmp());cur=state.employees.length-1;markDirty();render();toast('تمت إضافة موظفة جديدة');}
  else if(a==='dup'){var src=state.employees[cur],n=JSON.parse(JSON.stringify(src));n.id='e'+Date.now().toString(36);n.name='';n.goals.forEach(function(g){g.n='';g.r.forEach(function(r){r.s='';r.d='';});});n.notes='';XF.forEach(function(k){n[k]='';});
    state.employees.push(n);cur=state.employees.length-1;markDirty();render();toast('نُسخ النموذج بأوصاف الأهداف — أدخلي اسم الموظفة');}
  else if(a==='del'){if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='اضغطي مرة أخرى لتأكيد الحذف';setTimeout(function(){if(b.isConnected){b.classList.remove('arm');b.textContent='حذف هذه الموظفة';}},3500);return;}
    state.employees.splice(cur,1);cur=Math.max(0,cur-1);markDirty();render();toast('تم الحذف');}
  else if(a==='restore'){try{state=mig(JSON.parse(draftOffer));}catch(e){}draftOffer=null;cur=0;dirty=true;render();}
  else if(a==='discard'){draftOffer=null;try{localStorage.removeItem(DRAFT_KEY);}catch(e){}render();}
  else if(a==='save')save();
  else if(a==='backup'){var dt=new Date().toISOString().slice(0,10);downloadsCap.save({filename:'متابعة-الأهداف-'+dt+'.json',data:JSON.stringify(state,null,1)});toast('تم تنزيل النسخة الاحتياطية');}
  else if(a==='import'){var fi=document.createElement('input');fi.type='file';fi.accept='.json,application/json';fi.onchange=function(){var f=fi.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var ns=mig(JSON.parse(rd.result));if(!ns.employees)throw 0;state=ns;cur=0;markDirty();render();toast('تم استيراد البيانات');}catch(e){toast('الملف غير صالح');}};rd.readAsText(f);};fi.click();}
  else if(a==='pdf')exportPDF([state.employees[cur]],b);
  else if(a==='pdfall')exportPDF(state.employees,b);
});

/* ---------- save: republish the page with the new state embedded ---------- */
function buildDoc(){
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  var css=document.getElementById('css').textContent,app=document.getElementById('app').textContent;
  var C='<'+'/script>';
  return '<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>'+document.title+'</title>\n'+
   '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">\n<style id="css">'+css+'</style>\n'+
   '<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">'+C+'\n<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">'+C+'\n'+
   '<script type="application/json" id="state">'+json+C+'\n</head>\n<body>\n<div id="root"></div>\n<div id="printHost"></div>\n<div class="toast" id="toast"></div>\n<script id="app">'+app+C+'\n</body>\n</html>';
}
async function save(){if(!artifactCap||saving)return;saving=true;updateStatus();
  try{await artifactCap.publish(buildDoc());try{localStorage.removeItem(DRAFT_KEY);}catch(e){}dirty=false;toast('تم الحفظ');}
  catch(err){var c=err&&err.code;
    if(c==='conflict')toast('عُدّلت الصفحة من مكان آخر؛ ستُحدَّث الآن. تعديلاتك محفوظة كمسودة على هذا الجهاز.');
    else if(c==='not_granted'||c==='not_writer')toast('ليست لديك صلاحية الحفظ على هذه الصفحة.');
    else toast('تعذّر الحفظ، حاولي مرة أخرى.');}
  saving=false;updateStatus();}

/* ---------- PDF ---------- */
function goalNotes(e){var a=e.goals.map(function(g,i){return g.n&&g.n.trim()?'<div><b style="display:inline">الهدف '+ORD[i]+': </b>'+esc(g.n.trim())+'</div>':'';}).join('');return a?'<div class="extra"><b>ملاحظات الأهداف:</b>'+a+'</div>':'';}
function sheetHTML(e){
  var h='<div class="sheet"><div class="band t"></div><div class="band b"></div><div class="sh-h"><div class="sh-min">وزارة التعليم</div><div class="sh-en">Ministry of Education</div><div class="sh-t">المتابعة النصف سنوية لأهداف المساعد الإداري للعام '+esc(state.year)+'م</div></div>';
  h+='<table class="info"><tr><td class="k">اسم المساعد الإداري</td><td>'+esc(e.name)+'</td><td class="k">اليوم</td><td style="width:200px">'+esc(e.day)+'</td></tr><tr><td class="k">الوظيفة</td><td>'+esc(e.job)+'</td><td class="k">التاريخ</td><td>'+esc(e.date)+'</td></tr></table>';
  h+='<table class="g"><thead><tr><th class="gc" rowspan="2" style="text-align:center">الهدف</th>';
  for(var j=0;j<NR;j++)h+='<th colspan="2">التقرير '+ORD[j]+'</th>';
  h+='</tr><tr class="sub">';for(j=0;j<NR;j++)h+='<th>الإنجاز</th><th>التاريخ</th>';h+='</tr></thead><tbody>';
  e.goals.forEach(function(g,gi){h+='<tr><td class="gc">'+ORD[gi]+(g.t?'<small>'+esc(g.t)+'</small>':'')+'</td>';
    g.r.forEach(function(r){var s=r.s==='ok'?'<span class="st ok">تم</span>':r.s==='no'?'<span class="st no">لم يتم</span>':'<span class="st na">—</span>';
      h+='<td>'+s+'</td><td class="dt">'+esc(r.d)+'</td>';});h+='</tr>';});
  h+='</tbody></table><div class="bot"><div class="notes"><b>ملاحظات:</b>'+esc(e.notes)+goalNotes(e)+'</div>';
  h+='<div class="xk"><table><tr><td class="k">النمو المهني</td><td>'+esc(e.growth)+'</td></tr><tr><td class="k">الغياب بعذر</td><td>'+esc(e.absExc)+'</td></tr><tr><td class="k">الغياب بدون عذر</td><td>'+esc(e.absNo)+'</td></tr><tr><td class="k">التأخير الصباحي</td><td>'+esc(e.late)+(e.late&&/^[0-9٠-٩]+$/.test(String(e.late).trim())?' دقيقة':'')+'</td></tr><tr><td class="k">حضور الطابور الصباحي</td><td>'+esc(e.assembly)+'</td></tr></table></div>';
  h+='<div class="sig"><div><b>مديرة المدرسة / </b>'+esc(state.principal)+'</div><div><b>توقيع المساعد الإداري / </b>…………………………</div></div></div></div>';
  return h;
}
async function exportPDF(list,btn){
  if(!downloadsCap)return;if(!window.html2canvas||!window.jspdf){toast('أدوات التصدير لم تُحمَّل بعد، أعيدي المحاولة بعد لحظات.');return;}
  if(!list.length)return;var old=btn.textContent;btn.disabled=true;btn.textContent='جارٍ التجهيز…';
  try{
    var pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});var host=document.getElementById('printHost');
    try{await document.fonts.ready;}catch(e){}
    for(var i=0;i<list.length;i++){host.innerHTML=sheetHTML(list[i]);
      var cv=await html2canvas(host.firstElementChild,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
      if(i)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,297,210);}
    host.innerHTML='';
    var name=list.length===1?('متابعة أهداف - '+(list[0].name||'موظفة')):'متابعة أهداف المساعدات الإداريات';
    await downloadsCap.save({filename:name.replace(/[\\/:*?"<>|]/g,'')+'.pdf',data:pdf.output('blob')});
    toast('تم تجهيز ملف PDF');
  }catch(err){var c=err&&err.code;if(c==='declined'){}else if(c==='rate_limited')toast('هناك نافذة حفظ مفتوحة بالفعل.');else toast('تعذّر تصدير PDF.');}
  btn.disabled=false;btn.textContent=old;
}

render();
downloadsCap={save:function(o){var bl=o.data instanceof Blob?o.data:new Blob([o.data],{type:/\.json$/.test(o.filename)?'application/json':'application/octet-stream'});var u=URL.createObjectURL(bl);var l=document.createElement('a');l.href=u;l.download=o.filename;document.body.appendChild(l);l.click();setTimeout(function(){URL.revokeObjectURL(u);l.remove();},1500);return Promise.resolve({status:'saved'});}};
capsReady=true;render();
})();
</script>
</body>
</html>
